[build]
  command = "npm run build -w @healthcare/shared && npm run build -w @healthcare/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

# API requests go to the Cloudflare Worker, which adds the origin secret.
# The secret is stored in the Worker and is never in this file.
[[redirects]]
  from = "/api/*"
  to = "https://rss-origin-proxy.giritharanblude.workers.dev/api/:splat"
  status = 200
  force = true

# The SPA fallback must stay after the API rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
