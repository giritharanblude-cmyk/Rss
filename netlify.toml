[build]
  command = "npm run build -w @healthcare/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

# The edge function injects ORIGIN_SECRET without exposing it to browser code.
# Replace the example origin hostname with the deployed Caddy hostname.
[[redirects]]
  from = "/api/*"
  to = "https://origin.example.com/api/:splat"
  status = 200
  force = true

# API proxy must stay before the SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
