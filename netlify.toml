[build]
  command = "npm run build -w @healthcare/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

# API proxy to the VM. This rule must stay before the SPA fallback.
# Do not commit the real secret. If Netlify cannot substitute an environment
# variable into this header, restrict the VM instead (see docs/ARCHITECTURE.md).
[[redirects]]
  from = "/api/*"
  to = "https://origin.example.com/api/:splat"
  status = 200
  force = true
  headers = { X-Origin-Secret = "set-in-netlify-env-not-in-repo" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
