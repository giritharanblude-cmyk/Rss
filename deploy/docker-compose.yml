services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: healthcare-rss-api:local
    restart: unless-stopped
    mem_limit: 1536m
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: '3001'
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      ORIGIN_SECRET: ${ORIGIN_SECRET:-}
      ORIGIN_SECRET_ENFORCED: ${ORIGIN_SECRET_ENFORCED:-false}
      MASTER_EMAIL: ${MASTER_EMAIL:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Healthcare News Desk}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      CHROME_PATH: /usr/bin/chromium
    volumes:
      - openwa_session:/data/openwa

volumes:
  openwa_session:
